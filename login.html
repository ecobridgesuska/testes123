<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - ECOBRIDGE SUSKA</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Style Helpers -->
    <style>
        .glass-card-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .glow-sky {
            box-shadow: 0 0 30px -5px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="h-full font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-900">

    <!-- Background Decorative Elements -->
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:24px_24px] pointer-events-none"></div>
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full relative z-10">
        
        <!-- Back to Home Link -->
        <div class="mb-6">
            <a href="index.html" class="...">Kembali ke Beranda Website</a>
            </a>
        </div>

        <!-- Login Card Box -->
        <div class="glass-card-dark p-8 rounded-3xl glow-sky space-y-6">
            
            <!-- Logo & Header -->
            <div class="text-center space-y-3">
                <div class="inline-flex p-2.5 rounded-2xl bg-white shadow-md border border-slate-700">
                    <img src="eco.jpeg" alt="ECOBRIDGE SUSKA Logo" class="h-12 w-auto object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight">Admin Portal</h1>
                    <p class="text-xs text-sky-400 font-medium mt-0.5">ECOBRIDGE SUSKA RIAU</p>
                </div>
            </div>

            <!-- Pesan Notifikasi Error -->
            <div id="errorMessage" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center font-medium">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> Username atau Password salah!
            </div>

            <!-- Form Login dengan JavaScript -->
            <form onsubmit="handleLogin(event)" class="space-y-4 pt-2">
                
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Username Admin</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" placeholder="Masukkan username admin" required
                               class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition-all">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" placeholder="••••••••" required
                               class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 focus:ring-1 focus:ring-sky-400 transition-all">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            class="w-full py-3.5 px-4 bg-sky-400 hover:bg-sky-300 text-slate-900 font-bold rounded-xl text-sm shadow-lg shadow-sky-400/20 transition-all duration-300 transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Masuk ke Dashboard</span>
                    </button>
                </div>

            </form>

            <!-- Footer Info Card -->
            <div class="pt-4 border-t border-slate-800 text-center">
                <p class="text-[11px] text-slate-500">
                    Akses terbatas hanya untuk Pengurus / Admin Terverifikasi ECOBRIDGE SUSKA.
                </p>
            </div>

        </div>

    </div>

    <!-- SKRIP JAVASCRIPT PROSES LOGIN -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // Mencegah reload halaman

            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');

            // Username dan Password Baru
            const validUser = "ecobridgesuska";
            const validPass = "ecobridgesuskamomoyober3";

            if (userVal === validUser && passVal === validPass) {
                // Simpan status login di sessionStorage
                sessionStorage.setItem('isLoggedIn', 'true');
                
                // Pindah ke halaman dashboard admin
                window.location.href = 'admin.html';
            } else {
                // Tampilkan pesan kesalahan
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
