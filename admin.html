<!-- JAVASCRIPT & FIREBASE REALTIME SYNC -->
    <script>
        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuIcon = document.getElementById('menuIcon');
        const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            if (mobileMenu.classList.contains('hidden')) {
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
            } else {
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
            }
        });

        mobileNavLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
            });
        });

        // Table Filter Tabs Functionality
        const filterBtns = document.querySelectorAll('.tab-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-sky-400', 'text-slate-900', 'font-bold');
                    b.classList.add('text-slate-400', 'hover:text-white');
                });
                btn.classList.add('bg-sky-400', 'text-slate-900', 'font-bold');
                btn.classList.remove('text-slate-400', 'hover:text-white');

                const filterValue = btn.getAttribute('data-filter');
                const tableRows = document.querySelectorAll('.table-row');

                tableRows.forEach(row => {
                    const rowType = row.getAttribute('data-type');
                    if (filterValue === 'all' || rowType === filterValue) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });
    </script>

    <!-- FIREBASE REALTIME MODULE UNTUK INDEX -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6waiedwMizQhiZUEusFcMjXhSDbCHD_w",
            authDomain: "ecobridge-suska.firebaseapp.com",
            databaseURL: "https://ecobridge-suska-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ecobridge-suska",
            storageBucket: "ecobridge-suska.firebasestorage.app",
            messagingSenderId: "220748550670",
            appId: "1:220748550670:web:5ab37be742d23cc7b2e25f",
            measurementId: "G-9CCEJGBMK6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const transactionsRef = ref(db, 'transactions');

        onValue(transactionsRef, (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('tableBody');
            if (!tableBody) return;

            tableBody.innerHTML = '';
            let totalWeight = 0;
            let totalIncome = 0;
            let totalDonation = 0;

            if (data) {
                const transactions = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();

                transactions.forEach(tx => {
                    const formattedAmount = new Intl.NumberFormat('id-ID').format(tx.amount || 0);
                    const row = document.createElement('tr');
                    row.className = "table-row hover:bg-slate-700/30 transition-colors";
                    row.setAttribute('data-type', tx.type);

                    if (tx.type === 'pemasukan') {
                        totalWeight += Number(tx.weight || 0);
                        totalIncome += Number(tx.amount || 0);
                        row.innerHTML = `
                            <td class="py-4 px-4 whitespace-nowrap text-xs text-slate-400">${tx.date}</td>
                            <td class="py-4 px-4 font-medium text-white">${tx.desc} (${tx.weight} Kg)</td>
                            <td class="py-4 px-4">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20">
                                    <i class="fa-solid fa-arrow-down-left text-[10px]"></i> Pemasukan
                                </span>
                            </td>
                            <td class="py-4 px-4 text-right font-bold text-sky-400">+ Rp ${formattedAmount}</td>
                        `;
                    } else {
                        totalDonation += Number(tx.amount || 0);
                        row.innerHTML = `
                            <td class="py-4 px-4 whitespace-nowrap text-xs text-slate-400">${tx.date}</td>
                            <td class="py-4 px-4 font-medium text-white">${tx.desc}</td>
                            <td class="py-4 px-4">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <i class="fa-solid fa-hand-holding-heart text-[10px]"></i> Donasi Disalurkan
                                </span>
                            </td>
                            <td class="py-4 px-4 text-right font-bold text-emerald-400">- Rp ${formattedAmount}</td>
                        `;
                    }
                    tableBody.appendChild(row);
                });
            }

            // Update Kartu Statistik Publik secara Realtime
            if(document.getElementById('publicTotalWeight')) document.getElementById('publicTotalWeight').innerHTML = new Intl.NumberFormat('id-ID').format(totalWeight) + ' <span class="text-lg font-normal text-slate-400">Kg</span>';
            if(document.getElementById('publicTotalIncome')) document.getElementById('publicTotalIncome').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(totalIncome);
            if(document.getElementById('publicTotalDonation')) document.getElementById('publicTotalDonation').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(totalDonation);
        });
    </script>
