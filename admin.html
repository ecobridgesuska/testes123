<!-- FIREBASE REALTIME SCRIPT UNTUK ADMIN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6waiedwMizQhiZUEusFcMjXhSDbCHD_w",
            authDomain: "ecobridge-suska.firebaseapp.com",
            databaseURL: "https://ecobridge-suska-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "ecobridge-suska",
            storageBucket: "ecobridge-suska.firebasestorage.app",
            messagingSenderId: "220748550670",
            appId: "1:220748550670:web:5ab37be742d23cc7b2e25f",
            measurementId: "G-9CCEJGBMK6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const transactionsRef = ref(db, 'transactions');

        // Baca dan Tampilkan Data Realtime di Tabel Admin
        onValue(transactionsRef, (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('adminTableBody');
            if (!tableBody) return;

            tableBody.innerHTML = '';
            let totalWeight = 0;
            let totalIncome = 0;
            let totalDonation = 0;

            if (data) {
                Object.keys(data).forEach(id => {
                    const tx = data[id];
                    const formattedAmount = new Intl.NumberFormat('id-ID').format(tx.amount || 0);
                    const row = document.createElement('tr');
                    row.className = "border-b border-slate-800 hover:bg-slate-800/50 transition-colors";

                    if (tx.type === 'pemasukan') {
                        totalWeight += Number(tx.weight || 0);
                        totalIncome += Number(tx.amount || 0);
                        row.innerHTML = `
                            <td class="py-3 px-4 text-xs text-slate-400">${tx.date}</td>
                            <td class="py-3 px-4 font-medium text-white">${tx.desc} (${tx.weight} Kg)</td>
                            <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs bg-sky-500/10 text-sky-400">Pemasukan</span></td>
                            <td class="py-3 px-4 text-right font-bold text-sky-400">+ Rp ${formattedAmount}</td>
                            <td class="py-3 px-4 text-center">
                                <button data-id="${id}" class="btn-delete text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        `;
                    } else {
                        totalDonation += Number(tx.amount || 0);
                        row.innerHTML = `
                            <td class="py-3 px-4 text-xs text-slate-400">${tx.date}</td>
                            <td class="py-3 px-4 font-medium text-white">${tx.desc}</td>
                            <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs bg-emerald-500/10 text-emerald-400">Donasi</span></td>
                            <td class="py-3 px-4 text-right font-bold text-emerald-400">- Rp ${formattedAmount}</td>
                            <td class="py-3 px-4 text-center">
                                <button data-id="${id}" class="btn-delete text-rose-400 hover:text-rose-300 p-2"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        `;
                    }
                    tableBody.appendChild(row);
                });

                // Tombol Hapus Event Listener
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
                            remove(ref(db, 'transactions/' + id));
                        }
                    });
                });
            }

            // Update Kartu Statistik Admin
            if(document.getElementById('adminTotalWeight')) document.getElementById('adminTotalWeight').innerText = new Intl.NumberFormat('id-ID').format(totalWeight) + ' Kg';
            if(document.getElementById('adminTotalIncome')) document.getElementById('adminTotalIncome').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(totalIncome);
            if(document.getElementById('adminTotalDonation')) document.getElementById('adminTotalDonation').innerText = 'Rp ' + new Intl.NumberFormat('id-ID').format(totalDonation);
        });

        // Tambah Transaksi Form Submit
        const form = document.getElementById('transactionForm');
        if (form) {
            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const dateVal = document.getElementById('txDate').value;
                const descVal = document.getElementById('txDesc').value;
                const typeVal = document.getElementById('txType').value;
                const weightVal = document.getElementById('txWeight').value || 0;
                const amountVal = document.getElementById('txAmount').value;

                push(transactionsRef, {
                    date: dateVal,
                    desc: descVal,
                    type: typeVal,
                    weight: Number(weightVal),
                    amount: Number(amountVal)
                }).then(() => {
                    form.reset();
                    closeModal();
                    alert('Data transaksi berhasil disimpan secara realtime!');
                }).catch(err => {
                    alert('Gagal menyimpan: ' + err.message);
                });
            });
        }
    </script>

    <!-- SKRIP LOGOUT (TERPISAH & BERSIH) -->
    <script>
        function handleLogout(event) {
            event.preventDefault();
            // Hapus status login dari sessionStorage
            sessionStorage.removeItem('isLoggedIn');
            // Pindah kembali ke halaman login
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
